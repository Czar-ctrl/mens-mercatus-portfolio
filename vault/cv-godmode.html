  projects: [

      role: "Full-stack, .NET & AI systems",
      bullets: [

      bullets: [

  footer:
    "Portfolio: mensmercatus.online · THINK: /think/ · Walkthrough: /assets/video/walkthrough.mp4 · Johannesburg, South Africa · Open to Johannesburg, Pretoria, Cape Town & Durban (on-site, hybrid or remote) · AI eng and .NET roles."
};

</script>
<script>
(function () {
  const D = window.RESUME_DATA;
  if (!D) return;
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function fillText(attr, val) {
    $$(`[data-bind="${attr}"]`).forEach(el => { el.textContent = val; });
  }
  function fillHref(attr, href, label) {
    $$(`[data-bind-href="${attr}"]`).forEach(el => {
      el.setAttribute("href", href);
      if (label != null && !el.dataset.keepLabel) el.textContent = label;
    });
  }

  fillText("name", D.meta.name);
  fillText("headline", D.meta.headline);
  fillText("tagline", D.meta.tagline);
  fillText("location", D.meta.location);
  fillText("remote", D.meta.remote);
  fillText("status", D.meta.status);
  fillText("brand", D.meta.brand);
  fillText("email", D.meta.email);
  fillText("emailAlt", D.meta.emailAlt);
  fillText("phone", D.meta.phone);
  fillText("siteLabel", D.meta.siteLabel);
  fillText("targeting", D.meta.targeting);
  fillText("portfolioProof", D.meta.portfolioProof);
  fillText("footer", D.meta.footer || D.footer);
  fillHref("email", "mailto:" + D.meta.email, D.meta.email);
  fillHref("emailAlt", "mailto:" + D.meta.emailAlt, D.meta.emailAlt);
  fillHref("phone", "tel:" + D.meta.phoneIntl, D.meta.phone);
  fillHref("site", D.meta.site, D.meta.siteLabel);

  const roles = $("[data-roles]");
  if (roles) {
    roles.innerHTML = D.meta.roles.map(r => `<span class="pill">${r}</span>`).join("");
  }

  const stack = $("[data-stack]");
  if (stack) {
    const labels = {
      languages: "Languages", frontend: "Frontend", ai: "AI / ML",
      backend: "Backend", data: "Data", cloud: "Cloud & Infra",
      audio: "Audio / Realtime", systems: "Systems"
    };
    stack.innerHTML = Object.keys(labels).map(k => {
      if (!D.stack[k]) return "";
      return `<div class="stack-group"><div class="hud-label">${labels[k]}</div>
        <div class="chips">${D.stack[k].map(s => `<span class="chip">${s}</span>`).join("")}</div></div>`;
    }).join("");
  }

  const domains = $("[data-domains]");
  if (domains) {
    domains.innerHTML = D.domains.map(d => `
      <article class="domain-card">
        <div class="hud-label">${d.tags.join(" · ")}</div>
        <h3>${d.title}</h3>
        <p>${d.body}</p>
      </article>`).join("");
  }

  const flagships = $("[data-flagships]");
  if (flagships) {
    flagships.innerHTML = D.flagships.map(f => `
      <article class="flag-card" data-id="${f.id}">
        <div class="flag-top">
          <div>
            <div class="hud-label">${f.period} · ${f.kind}</div>
            <h3>${f.name}</h3>
          </div>
          <span class="status-pill" title="${f.statusNote}">${f.status}</span>
        </div>
        <p class="flag-summary">${f.summary}</p>
        <ul>${f.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        <div class="chips">${f.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
      </article>`).join("");
  }

  const projects = $("[data-projects]");
  if (projects) {
    projects.innerHTML = D.projects.map(p => `
      <article class="proj-card">
        <div class="proj-head">
          <div>
            <h3>${p.name}</h3>
            <div class="role">${p.role}</div>
          </div>
          <div class="period">${p.period}</div>
        </div>
        <ul>${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        <div class="chips">${p.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
      </article>`).join("");
  }

  const narrative = $("[data-narrative]");
  if (narrative) {
    narrative.innerHTML = D.narrative.map(n => `<li>${n}</li>`).join("");
  }

  // ATS plain render
  const ats = $("[data-ats]");
  if (ats) {
    const stackLines = Object.entries({
      "Languages": D.stack.languages,
      "Frontend": D.stack.frontend,
      "AI / ML": D.stack.ai,
      "Backend": D.stack.backend,
      "Data": D.stack.data,
      "Cloud & Infra": D.stack.cloud,
      "Audio / Realtime": D.stack.audio,
      "Systems": D.stack.systems
    }).map(([k,v]) => `<p><strong>${k}:</strong> ${v.join(", ")}</p>`).join("");

    ats.innerHTML = `
      <header class="ats-header">
        <h1>${D.meta.name}</h1>
        <p class="ats-headline">${D.meta.headline}</p>
        <p class="ats-contact">
          ${D.meta.email} · ${D.meta.phone} · ${D.meta.siteLabel} · ${D.meta.location} · ${D.meta.remote}
        </p>
        <p class="ats-status">Status: ${D.meta.status}</p>
      </header>
      <section>
        <h2>Summary</h2>
        <p>${D.meta.tagline}</p>
        <p>${D.meta.targeting}</p>
        <p>${D.meta.portfolioProof}</p>
      </section>
      <section>
        <h2>Technical Stack</h2>
        ${stackLines}
      </section>
      <section>
        <h2>Core Domains</h2>
        ${D.domains.map(d => `<h3>${d.title}</h3><p>${d.body}</p><p><em>${d.tags.join(" · ")}</em></p>`).join("")}
      </section>
      <section>
        <h2>Selected AI Portfolio</h2>
        ${D.flagships.map(f => `
          <h3>${f.name} — ${f.period} · ${f.kind} [${f.status}]</h3>
          <p>${f.summary}</p>
          <ul>${f.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          <p><em>${f.chips.join(", ")}</em></p>
        `).join("")}
        ${D.projects.map(p => `
          <h3>${p.name} — ${p.period}</h3>
          <p><strong>${p.role}</strong></p>
          <ul>${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          <p><em>${p.chips.join(", ")}</em></p>
        `).join("")}
      </section>
      <section>
        <h2>Selected Experience Narrative</h2>
        <ul>${D.narrative.map(n => `<li>${n}</li>`).join("")}</ul>
      </section>
      <footer class="ats-footer"><p>${D.footer}</p></footer>
    `;
  }

  window.printResume = () => window.print();
})();
</script>

</body>
</html>
