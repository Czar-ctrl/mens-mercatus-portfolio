<html lang="en">

<style>
:root {
  --bg:#050505; --panel:#0e0e0e; --line:#1f1f1f; --white:#f5f5f5; --muted:#888;
  --red:#c8102e; --font:"Inter",system-ui,sans-serif; --mono:"Space Mono",monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--white); min-height:100vh; }
a { color:var(--red); }
.shell { display:grid; grid-template-columns: 260px 1fr; min-height:100vh; }
@media (max-width:900px) { .shell { grid-template-columns:1fr; } .rail { border-right:0; border-bottom:1px solid var(--line); } }
.rail {
  border-right:1px solid var(--line); background:var(--panel); padding:1.5rem 1.1rem;
  position:sticky; top:0; height:100vh; overflow:auto;
}
@media (max-width:900px) { .rail { position:relative; height:auto; } }
.logo {
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); margin-bottom:1.25rem;
}
.rail h1 { font-size:1.35rem; letter-spacing:-.02em; margin-bottom:.35rem; }
.rail .hl { font-size:.75rem; color:var(--muted); margin-bottom:1rem; line-height:1.4; }
.nav-tabs { display:flex; flex-direction:column; gap:.35rem; margin:1.25rem 0; }
.nav-tabs button {
  text-align:left; background:transparent; border:1px solid transparent; color:var(--muted);
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  padding:.55rem .7rem; border-radius:8px; cursor:pointer;
}
.nav-tabs button.active, .nav-tabs button:hover {
  color:var(--white); border-color:var(--line); background:rgba(200,16,46,.12);
}
.rail-contact { font-size:.8rem; color:var(--muted); line-height:1.7; overflow:visible; }
.rail-contact a { color:var(--white); text-decoration:none; }
.rail-contact a[data-bind-href="site"],
.rail-contact .site-link {
  white-space: nowrap; overflow: visible; text-overflow: clip;
  max-width: none; display: inline-block; word-break: keep-all;
}
.status {
  display:inline-flex; align-items:center; gap:.35rem; margin:1rem 0;
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:#ff6b7a;
}
.status i { width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; box-shadow:0 0 10px rgba(200,16,46,.6); }
.stage { padding:1.5rem 1.75rem 3rem; }
.toolbar { display:flex; gap:.6rem; justify-content:flex-end; margin-bottom:1rem; flex-wrap:wrap; }
.btn-print, .btn-ghost {
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  padding:.5rem .85rem; border-radius:999px; border:1px solid var(--line); cursor:pointer;
  background:var(--red); color:#fff;
}
.btn-ghost { background:transparent; color:var(--white); text-decoration:none; display:inline-flex; align-items:center; }
.panel {
  display:none; border:1px solid var(--line); border-radius:16px; padding:1.35rem;
  background:linear-gradient(160deg, rgba(200,16,46,.05), transparent 35%), var(--panel);
  animation: fade .35s ease;
}
.panel.active { display:block; }
@keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.panel h2 {
  font-size:1.1rem; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem;
}
.panel h2::before { content:""; width:8px; height:8px; background:var(--red); border-radius:2px; }
.hud-label { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:.3rem; }
.chips { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem; }
.chip {
  font-family:var(--mono); font-size:10px; padding:.2rem .45rem; border-radius:6px;
  background:rgba(200,16,46,.14); color:#e8a0a8; border:1px solid rgba(200,16,46,.25);
}
.flag-card, .proj-card, .domain-card {
  border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:.75rem;
  background:rgba(0,0,0,.25);
}
.flag-top { display:flex; justify-content:space-between; gap:.5rem; }
.status-pill {
  font-family:var(--mono); font-size:9px; letter-spacing:.12em; padding:.25rem .5rem;
  border-radius:999px; border:1px solid rgba(200,16,46,.5); color:#ff8a95; height:fit-content;
}
.flag-card h3, .proj-card h3, .domain-card h3 { font-size:1.05rem; margin:.2rem 0 .4rem; }
.flag-summary, .domain-card p, .lead { color:var(--muted); font-size:.9rem; }
ul { margin:.4rem 0 .5rem 1.1rem; color:var(--muted); font-size:.88rem; }
.proj-head { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
.period { font-family:var(--mono); font-size:11px; color:var(--muted); }
.stack-group { margin-bottom:.8rem; }
.pills { display:flex; flex-wrap:wrap; gap:.35rem; margin:.75rem 0; }
.pill { font-size:12px; padding:.25rem .6rem; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
.foot { margin-top:1.5rem; font-size:.8rem; color:var(--muted); }
@media print {
  .no-print, .rail .nav-tabs, .toolbar { display:none !important; }
  .shell { display:block; }
  .rail { position:static; height:auto; border:0; padding:0 0 1rem; }
  .panel { display:block !important; break-inside:avoid; margin-bottom:1rem; background:#fff; color:#111; border-color:#ccc; }
  body { background:#fff; color:#111; }
  .chip, .pill { color:#333; background:#eee; }
  @page { margin:12mm; size:A4; }
}

/* PRINT_CONTACT_FIX */
@media print {
  .rail, .rail-contact { overflow: visible !important; }
  .rail-contact a[data-bind-href="site"],
  .rail-contact .site-link {
    white-space: nowrap !important;
    overflow: visible !important;
    text-overflow: clip !important;
    max-width: none !important;
  }
}
</style>

<script>
(function () {
  const D = window.RESUME_DATA;
  if (!D) return;
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function fillText(attr, val) {
    $$(`[data-bind="${attr}"]`).forEach(el => { el.textContent = val; });
  }
  function fillHref(attr, href, label) {
    $$(`[data-bind-href="${attr}"]`).forEach(el => {
      el.setAttribute("href", href);
      if (label != null && !el.dataset.keepLabel) el.textContent = label;
    });
  }

  fillText("name", D.meta.name);
  fillText("headline", D.meta.headline);
  fillText("tagline", D.meta.tagline);
  fillText("location", D.meta.location);
  fillText("remote", D.meta.remote);
  fillText("status", D.meta.status);
  fillText("brand", D.meta.brand);
  fillText("email", D.meta.email);
  fillText("emailAlt", D.meta.emailAlt);
  fillText("phone", D.meta.phone);
  fillText("siteLabel", D.meta.siteLabel);
  fillText("targeting", D.meta.targeting);
  fillText("portfolioProof", D.meta.portfolioProof);
  fillText("footer", D.meta.footer || D.footer);
  fillHref("email", "mailto:" + D.meta.email, D.meta.email);
  fillHref("emailAlt", "mailto:" + D.meta.emailAlt, D.meta.emailAlt);
  fillHref("phone", "tel:" + D.meta.phoneIntl, D.meta.phone);
  fillHref("site", D.meta.site, D.meta.siteLabel);

  const roles = $("[data-roles]");
  if (roles) {
    roles.innerHTML = D.meta.roles.map(r => `<span class="pill">${r}</span>`).join("");
  }

  const stack = $("[data-stack]");
  if (stack) {
    const labels = {
      languages: "Languages", frontend: "Frontend", ai: "AI / ML",
      backend: "Backend", data: "Data", cloud: "Cloud & Infra",
      audio: "Audio / Realtime", systems: "Systems"
    };
    stack.innerHTML = Object.keys(labels).map(k => {
      if (!D.stack[k]) return "";
      return `<div class="stack-group"><div class="hud-label">${labels[k]}</div>
        <div class="chips">${D.stack[k].map(s => `<span class="chip">${s}</span>`).join("")}</div></div>`;
    }).join("");
  }

  const domains = $("[data-domains]");
  if (domains) {
    domains.innerHTML = D.domains.map(d => `
      <article class="domain-card">
        <div class="hud-label">${d.tags.join(" · ")}</div>
        <h3>${d.title}</h3>
        <p>${d.body}</p>
      </article>`).join("");
  }

  const flagships = $("[data-flagships]");
  if (flagships) {
    flagships.innerHTML = D.flagships.map(f => `
      <article class="flag-card" data-id="${f.id}">
        <div class="flag-top">
          <div>
            <div class="hud-label">${f.period} · ${f.kind}</div>
            <h3>${f.name}</h3>
          </div>
          <span class="status-pill" title="${f.statusNote}">${f.status}</span>
        </div>
        <p class="flag-summary">${f.summary}</p>
        <ul>${f.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        <div class="chips">${f.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
      </article>`).join("");
  }

  const projects = $("[data-projects]");
  if (projects) {
    projects.innerHTML = D.projects.map(p => `
      <article class="proj-card">
        <div class="proj-head">
          <div>
            <h3>${p.name}</h3>
            <div class="role">${p.role}</div>
          </div>
          <div class="period">${p.period}</div>
        </div>
        <ul>${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        <div class="chips">${p.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
      </article>`).join("");
  }

  const narrative = $("[data-narrative]");
  if (narrative) {
    narrative.innerHTML = D.narrative.map(n => `<li>${n}</li>`).join("");
  }

  // ATS plain render
  const ats = $("[data-ats]");
  if (ats) {
    const stackLines = Object.entries({
      "Languages": D.stack.languages,
      "Frontend": D.stack.frontend,
      "AI / ML": D.stack.ai,
      "Backend": D.stack.backend,
      "Data": D.stack.data,
      "Cloud & Infra": D.stack.cloud,
      "Audio / Realtime": D.stack.audio,
      "Systems": D.stack.systems
    }).map(([k,v]) => `<p><strong>${k}:</strong> ${v.join(", ")}</p>`).join("");

    ats.innerHTML = `
      <header class="ats-header">
        <h1>${D.meta.name}</h1>
        <p class="ats-headline">${D.meta.headline}</p>
        <p class="ats-contact">
          ${D.meta.email} · ${D.meta.phone} · ${D.meta.siteLabel} · ${D.meta.location} · ${D.meta.remote}
        </p>
        <p class="ats-status">Status: ${D.meta.status}</p>
      </header>
      <section>
        <h2>Summary</h2>
        <p>${D.meta.tagline}</p>
        <p>${D.meta.targeting}</p>
        <p>${D.meta.portfolioProof}</p>
      </section>
      <section>
        <h2>Technical Stack</h2>
        ${stackLines}
      </section>
      <section>
        <h2>Core Domains</h2>
        ${D.domains.map(d => `<h3>${d.title}</h3><p>${d.body}</p><p><em>${d.tags.join(" · ")}</em></p>`).join("")}
      </section>
      <section>
        <h2>Selected AI Portfolio</h2>
        ${D.flagships.map(f => `
          <h3>${f.name} — ${f.period} · ${f.kind} [${f.status}]</h3>
          <p>${f.summary}</p>
          <ul>${f.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          <p><em>${f.chips.join(", ")}</em></p>
        `).join("")}
        ${D.projects.map(p => `
          <h3>${p.name} — ${p.period}</h3>
          <p><strong>${p.role}</strong></p>
          <ul>${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          <p><em>${p.chips.join(", ")}</em></p>
        `).join("")}
      </section>
      <section>
        <h2>Selected Experience Narrative</h2>
        <ul>${D.narrative.map(n => `<li>${n}</li>`).join("")}</ul>
      </section>
      <footer class="ats-footer"><p>${D.footer}</p></footer>
    `;
  }

  window.printResume = () => window.print();
})();
</script>

<script>
document.querySelectorAll("[data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-tab]").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});
</script>
</body>
</html>
