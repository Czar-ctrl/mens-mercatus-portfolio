    <text x="76" y="344" fill="#8A8A8A" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Location is personal information — minimise retention and purpose-limit to P2P context / mutual ping.</text><text x="76" y="360" fill="#8A8A8A" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">No always-on tracking. Ping is explicit, revocable, and off by default per friend.</text><text x="76" y="376" fill="#8A8A8A" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Assist explains consent state; never enables ping silently.</text></g>
