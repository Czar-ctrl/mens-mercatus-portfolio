  <script>
  /* sx-theme-boot: apply saved theme before paint to avoid flash */
  (function () {
    try {
      var t = localStorage.getItem('mm-sound-deck-theme') || 'blink';
      var a = localStorage.getItem('mm-sound-deck-accent');
      document.documentElement.setAttribute('data-sx-theme', t);
      if (a && /^#[0-9A-Fa-f]{3,8}$/.test(a)) {
        document.documentElement.style.setProperty('--gold', a);
        document.documentElement.style.setProperty('--accent', a);
      }
    } catch (e) {}
  })();
  </script>
