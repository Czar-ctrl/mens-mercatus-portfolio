  <meta charset="utf-8" /><script>/* mm-theme-v2: dark by default; one-time reset of older saved light choices */try{(function(){var s=localStorage;if(s.getItem('mm-theme-v')!=='2'){var b=s.getItem('mm-ambient-before-light');s.removeItem('theme');s.removeItem('mm-color-mode');if(s.getItem('mm-ambient-variant')==='light-3d'){s.setItem('mm-ambient-variant',b&&b!=='light-3d'?b:'web')}s.setItem('mm-theme-v','2')}})()}catch(e){}</script>

    html, body { margin: 0; min-height: 100%; background: #0a0a0a; }

      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;

      background: rgba(0,0,0,0.55); color: #8a8a8a; font: 0.78rem/1.35 Inter, system-ui, sans-serif;

    .raw-bar a { color: #f5f5f5; text-decoration: none; }
    .raw-bar a:hover { color: #f5f5f5; }
    .raw-bar .mono { font-family: ui-monospace, monospace; color: #c8102e; }
    #assist-live-pill {
      margin-left: auto; padding: 0.2rem 0.55rem; border: 1px solid #333; border-radius: 999px;
      font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8a8a;

    #assist-live-pill.is-demo { border-color: #c8102e; color: #c8102e; }
    #assist-live-pill.is-live, #assist-live-pill.is-mixed { border-color: #f5f5f5; color: #f5f5f5; }
    .mm-shell { min-height: calc(100vh - 48px); }
