<dialog id="dlg">
  <div class="dlg-bar">
    <strong id="cap"></strong>
    <span>
      <button class="nav" type="button" id="prev">Prev</button>
      <button class="nav" type="button" id="next">Next</button>
      <button class="nav" type="button" id="close">Close</button>
    </span>
  </div>
  <img id="full" alt="">
</dialog>
<script>
const shots = [...document.querySelectorAll(".shot")];
const dlg = document.getElementById("dlg");
const full = document.getElementById("full");
const cap = document.getElementById("cap");
let i = 0;
function openAt(n) {
  const vis = shots.filter((s) => s.style.display !== "none");
  if (!vis.length) return;
  i = (n + vis.length) % vis.length;
  const s = vis[i];
  full.src = s.dataset.src;
  full.alt = s.dataset.title;
  cap.textContent = s.dataset.title;
  if (!dlg.open) dlg.showModal();
}
shots.forEach((s) => s.addEventListener("click", () => openAt(shots.filter(x => x.style.display !== "none").indexOf(s))));
document.getElementById("prev").onclick = () => openAt(i - 1);
document.getElementById("next").onclick = () => openAt(i + 1);
document.getElementById("close").onclick = () => dlg.close();
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
document.addEventListener("keydown", (e) => {
  if (!dlg.open) return;
  if (e.key === "ArrowRight") openAt(i + 1);
  if (e.key === "ArrowLeft") openAt(i - 1);
});
document.getElementById("q").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  shots.forEach((s) => { s.style.display = s.dataset.title.toLowerCase().includes(q) ? "" : "none"; });
});
</script>
